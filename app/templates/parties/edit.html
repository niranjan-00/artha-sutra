{% extends 'base.html' %}
{% block title %}Edit {{ party.name }} — Artha Sutra{% endblock %}
{% block content %}<div class="page-heading"><div><div class="eyebrow"><span class="eyebrow-line"></span> CONTACT DETAILS</div><h1>Edit {{ 'customer' if kind=='customers' else 'supplier' }}</h1><p>Invoice and payment history remains linked to this record.</p></div><a class="btn btn-outline-soft btn-sm" href="{{ url_for('parties.customer_detail' if kind=='customers' else 'parties.supplier_detail', party_id=party.id) }}">Cancel</a></div><form class="form-card" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="mb-3"><label class="form-label" for="name">Name</label><input class="form-control" id="name" name="name" maxlength="160" required value="{{ request.form.get('name',party.name) }}"></div><div class="form-grid"><div class="mb-3"><label class="form-label" for="phone">Phone</label><input class="form-control" id="phone" name="phone" maxlength="40" value="{{ request.form.get('phone',party.phone or '') }}"></div><div class="mb-3"><label class="form-label" for="email">Email</label><input class="form-control" id="email" name="email" type="email" maxlength="254" value="{{ request.form.get('email',party.email or '') }}"></div><div class="mb-3 span-2"><label class="form-label" for="address">Address</label><input class="form-control" id="address" name="address" maxlength="300" value="{{ request.form.get('address',party.address or '') }}"></div><div class="mb-3 span-2"><label class="form-label" for="notes">Notes</label><textarea class="form-control" id="notes" name="notes" rows="3">{{ request.form.get('notes',party.notes or '') }}</textarea></div></div><div class="form-actions"><button class="btn btn-ink" type="submit">Save contact</button></div></form>{% endblock %}
