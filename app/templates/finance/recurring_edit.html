{% extends 'base.html' %}
{% block title %}Edit recurring expense — Artha Sutra{% endblock %}
{% block content %}<div class="page-heading"><div><div class="eyebrow"><span class="eyebrow-line"></span> REPEATING COMMITMENT</div><h1>Edit recurring expense</h1><p>Future forecast occurrences update from these saved settings.</p></div><a class="btn btn-outline-soft btn-sm" href="{{ url_for('recurring.list_recurring') }}">Cancel</a></div><form class="form-card" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="mb-3"><label class="form-label" for="name">Expense name</label><input class="form-control" name="name" id="name" maxlength="160" required value="{{ request.form.get('name',expense.name) }}"></div><div class="form-grid"><div class="mb-3"><label class="form-label" for="amount">Amount</label><div class="input-group"><span class="input-group-text">₹</span><input class="form-control" name="amount" id="amount" inputmode="decimal" required value="{{ request.form.get('amount',(expense.amount_paise/100)|string) }}"></div></div><div class="mb-3"><label class="form-label" for="category">Category</label><input class="form-control" name="category" id="category" maxlength="80" value="{{ request.form.get('category',expense.category) }}"></div><div class="mb-3"><label class="form-label" for="frequency">Frequency</label><select class="form-select" name="frequency" id="frequency">{% for frequency in frequencies %}<option value="{{ frequency }}" {% if request.form.get('frequency',expense.frequency)==frequency %}selected{% endif %}>{{ frequency|title }}</option>{% endfor %}</select></div><div class="mb-3"><label class="form-label" for="next_due_date">Next due date</label><input class="form-control" type="date" name="next_due_date" id="next_due_date" value="{{ request.form.get('next_due_date',expense.next_due_date.isoformat() if expense.next_due_date else '') }}"></div></div><div class="form-actions"><button class="btn btn-ink" type="submit">Save changes</button></div></form>{% endblock %}
